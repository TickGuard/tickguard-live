<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact – TickGuard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f5f7fa; line-height: 1.6; color: #333; }
    h1 { color: #0a3d62; }
    label { display: block; margin-top: 15px; }
    input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 20px; padding: 10px 20px; background: #0a3d62; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #07405a; }
  </style>
</head>
<body>

<h1>Contact Us</h1>
<p>Have questions about TickGuard or need support? Send us a message below.</p>

<form>
  <label>Name</label>
  <input type="text" placeholder="Your name">

  <label>Email</label>
  <input type="email" placeholder="you@example.com">

  <label>Message</label>
  <textarea rows="6" placeholder="Your message"></textarea>

  <button type="submit">Send</button>
</form>

<p style="margin-top: 30px;">
  Or email us directly at: <a href="mailto:Keith@TickGuardLabs.com">Keith@TickGuardLabs.com</a>
  <p>

</body>
</html>
